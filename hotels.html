<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <title>Book Hotels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="stylesheets/normalize.css" media="screen">
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" type="text/css" href="stylesheets/stylesheet.css" media="screen">
</head>
<body>
  <section class="page-header">
    <h1 class="project-name">Book a Hotel</h1>
    <a href="index.html" class="btn">Home</a>
  </section>
  <section class="main-content">
    <form>
      <label>Destination<br><input type="text" name="destination" required></label><br><br>
      <label>Check-in Date<br><input type="date" name="checkin" required></label><br><br>
      <label>Check-out Date<br><input type="date" name="checkout" required></label><br><br>
      <label>Guests<br><input type="number" name="guests" min="1" value="1" required></label><br><br>
      <button class="btn" type="submit">Search Hotels</button>
    </form>
    <footer class="site-footer">
      <span class="site-footer-owner">Sample Travel App</span>
    </footer>
  </section>
</body>
</html>
