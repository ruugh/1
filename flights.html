<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <title>Book Flights</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="stylesheets/normalize.css" media="screen">
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" type="text/css" href="stylesheets/stylesheet.css" media="screen">
</head>
<body>
  <section class="page-header">
    <h1 class="project-name">Book a Flight</h1>
    <a href="index.html" class="btn">Home</a>
  </section>
  <section class="main-content">
    <form>
      <label>From<br><input type="text" name="from" required></label><br><br>
      <label>To<br><input type="text" name="to" required></label><br><br>
      <label>Departure Date<br><input type="date" name="depart" required></label><br><br>
      <label>Return Date<br><input type="date" name="return"></label><br><br>
      <label>Passengers<br><input type="number" name="passengers" min="1" value="1" required></label><br><br>
      <button class="btn" type="submit">Search Flights</button>
    </form>
    <footer class="site-footer">
      <span class="site-footer-owner">Sample Travel App</span>
    </footer>
  </section>
</body>
</html>
